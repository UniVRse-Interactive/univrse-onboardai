# Checks every pull request to main or staging and every commit on either.
# deploy.yml calls this workflow (workflow_call, run-all: true) and deploys only
# when all of its jobs pass. Verify (including the migration file check) and
# Database migrations always run. The Docker builds run only when a file that goes
# into the images changed (job `changes`); otherwise each of the three Docker
# checks still reports, with its build steps skipped.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_call:
    inputs:
      run-all:
        description: Build every image even when no image input changed. deploy.yml sets it.
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run (push to
# main or staging, or a call from deploy.yml) gets its own group, so a deploy's
# CI run is never cancelled or queued behind another run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Lists every file in server/migrations and server/migrations/firestore
      # and fails on one the runner would skip (bad name) or a repeated number.
      - name: Check migration files
        run: npm run db:migrations:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check shareable files
        run: npm run check:share

  # Applies every migration twice to throwaway databases: PostgreSQL 17 (the
  # Cloud SQL version) and the Firestore emulator, with MIGRATION_TARGETS as the
  # deploy's migration job sets it. The first run must apply every file the
  # file check lists, the second none (each file runs once per database), and
  # neither may print the database URL or its password. Always runs (about two
  # minutes); deploy.yml deploys only when it passes.
  migrations:
    name: Database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: onboardai
          POSTGRES_PASSWORD: onboardai_ci_throwaway
          POSTGRES_DB: onboardai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboardai -d onboardai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # gcloud's Firestore emulator (589.0.0), pinned by digest.
      FIRESTORE_EMULATOR_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:589.0.0-emulators@sha256:dff831e11d4013af597446d43e1222a9196d9b2b0c8180606bb2e35bf1ea6e03
      DATABASE_URL: postgresql://onboardai:onboardai_ci_throwaway@127.0.0.1:5432/onboardai
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8681
      FIRESTORE_PROJECT_ID: demo-onboardai
      FIRESTORE_DATABASE_ID: '(default)'
      MIGRATION_TARGETS: sql,firestore
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the Firestore emulator
        run: |
          set -euo pipefail
          docker run -d --name firestore-emulator -p 127.0.0.1:8681:8681 "$FIRESTORE_EMULATOR_IMAGE" \
            gcloud emulators firestore start --host-port=0.0.0.0:8681
          for ((i = 1; i <= 60; i++)); do
            if curl -fsS --max-time 2 "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null 2>&1; then
              echo "Firestore emulator ready after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          docker logs firestore-emulator 2>&1 | tail -n 20
          echo "::error::The Firestore emulator did not start within 120 s."
          exit 1

      - name: Apply the migrations twice
        run: |
          set -euo pipefail
          # Expected counts: the file check's last line is
          # "Migration files OK: sql <n>, firestore <n>."
          summary=$(npm run --silent db:migrations:check | tail -n 1)
          if [[ ! "$summary" =~ ^Migration\ files\ OK:\ sql\ ([0-9]+),\ firestore\ ([0-9]+)\.$ ]]; then
            echo "::error::npm run db:migrations:check did not end with its summary line."
            exit 1
          fi
          sql=${BASH_REMATCH[1]}
          firestore=${BASH_REMATCH[2]}
          echo "Migration files: sql $sql, firestore $firestore"

          failed=0
          # count PATTERN FILE: lines of FILE that match PATTERN.
          count() { grep -cE "$1" "$2" || true; }
          # check RUN WHAT GOT WANT: one expectation of one run.
          check() {
            if [[ "$3" == "$4" ]]; then
              echo "ok   $1 run: $2"
            else
              echo "::error::$1 run of npm run db:migrate: $2 is '$3', expected '$4'."
              failed=1
            fi
          }
          # migrate RUN: runs npm run db:migrate once; output in $RUNNER_TEMP/RUN.out.
          migrate() {
            local out="$RUNNER_TEMP/$1.out" err="$RUNNER_TEMP/$1.err" status=0
            npm run --silent db:migrate > "$out" 2> "$err" || status=$?
            if grep -qiE 'postgres(ql)?://|onboardai_ci_throwaway' "$out" "$err"; then
              echo "::error::The $1 run of npm run db:migrate printed the database URL or its password."
              exit 1
            fi
            echo "::group::npm run db:migrate ($1 run)"
            cat "$out"
            cat "$err" >&2
            echo "::endgroup::"
            if ((status != 0)); then
              echo "::error::The $1 run of npm run db:migrate failed (exit $status)."
              exit 1
            fi
          }

          migrate first
          out="$RUNNER_TEMP/first.out"
          check first "last line" "$(tail -n 1 "$out")" "Migrations finished: sql $sql applied, 0 already applied; firestore $firestore applied, 0 already applied."
          check first "[sql] Applied lines" "$(count '^\[sql\] Applied: ' "$out")" "$sql"
          check first "[firestore] Applied lines" "$(count '^\[firestore\] Applied: ' "$out")" "$firestore"
          check first "Already applied lines" "$(count '^\[(sql|firestore)\] Already applied: ' "$out")" 0

          migrate second
          out="$RUNNER_TEMP/second.out"
          check second "last line" "$(tail -n 1 "$out")" "Migrations finished: sql 0 applied, $sql already applied; firestore 0 applied, $firestore already applied."
          check second "[sql] Already applied lines" "$(count '^\[sql\] Already applied: ' "$out")" "$sql"
          check second "[firestore] Already applied lines" "$(count '^\[firestore\] Already applied: ' "$out")" "$firestore"
          check second "Applied lines" "$(count '^\[(sql|firestore)\] Applied: ' "$out")" 0
          exit "$failed"

  changes:
    name: Detect image changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      # Full commit history without file contents: enough for merge-base and
      # name-only diffs. Not needed when run-all decides on its own.
      - name: Check out
        if: ${{ !inputs.run-all }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes to image inputs
        id: detect
        env:
          RUN_ALL: ${{ inputs.run-all }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Image inputs: every path that can change what the Dockerfile builds.
          # Keep in step with the Dockerfile and .dockerignore. Workflows,
          # terraform/, docs/, *.md and .gitignore never reach an image.
          image_inputs=(
            Dockerfile
            .dockerignore
            package.json
            package-lock.json
            index.html
            'vite.config.*'
            server
            src
            public
            scripts
          )

          # decide true|false REASON: writes the output and stops.
          decide() {
            echo "images=$1" >> "$GITHUB_OUTPUT"
            echo "images=$1 ($2)"
            exit 0
          }

          # Anything unexpected builds the images: a skip must be proven.
          if [[ "$RUN_ALL" == true ]]; then
            decide true "run-all requested"
          fi
          case "$EVENT_NAME" in
            pull_request) from=$PR_BASE_SHA to=$PR_HEAD_SHA range="$PR_BASE_SHA...$PR_HEAD_SHA" ;;
            push) from=$PUSH_BEFORE_SHA to=$PUSH_AFTER_SHA range="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA" ;;
            *) decide true "event $EVENT_NAME has no diff range" ;;
          esac
          sha='^[0-9a-f]{40}$'
          if [[ ! "$from" =~ $sha || ! "$to" =~ $sha || "$from" == 0000000000000000000000000000000000000000 ]]; then
            decide true "no usable base commit (new branch or missing SHA)"
          fi
          if ! git cat-file -e "$from^{commit}" 2> /dev/null || ! git cat-file -e "$to^{commit}" 2> /dev/null; then
            decide true "commit $from or $to is not in the fetched history"
          fi
          if [[ "$EVENT_NAME" == push ]] && ! git merge-base --is-ancestor "$from" "$to"; then
            decide true "push is not a fast-forward (force push)"
          fi
          # pull_request: base...head diffs from the merge base (three dots).
          if ! changed=$(git diff --name-only --no-renames "$range" -- "${image_inputs[@]}"); then
            decide true "git diff $range failed"
          fi
          if [[ -n "$changed" ]]; then
            echo "Image inputs changed in $range:"
            echo "$changed"
            decide true "image inputs changed"
          fi
          decide false "no image input changed in $range"

  docker:
    name: Docker build (${{ matrix.service }})
    needs: changes
    # Always true unless the run was cancelled, so the matrix expands and the
    # checks "Docker build (web|api|tts)" always report. The steps decide.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, tts]
    steps:
      - name: Skip, no image input changed
        if: needs.changes.outputs.images == 'false'
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "::notice title=Docker build ($SERVICE) skipped::No file that goes into the images changed, so the image was not built."

      # Builds unless `changes` positively said false (a failed or missing
      # result builds).
      - name: Check out
        if: needs.changes.outputs.images != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The service contract's build command. Nothing is pushed.
      - name: Build ${{ matrix.service }} image
        if: needs.changes.outputs.images != 'false'
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build --platform linux/amd64 --target "$SERVICE" -t "onboardai-$SERVICE:ci" .

      # The deploy's migration job runs npm run db:migrate from the api image:
      # the image must carry the runner and every migration file. No database.
      - name: Check the api image carries the migrations
        if: needs.changes.outputs.images != 'false' && matrix.service == 'api'
        run: docker run --rm --platform linux/amd64 onboardai-api:ci npm run --silent db:migrations:check
