# Deploys to Cloud Run: main to production, staging to the staging stack
# (onboardai-*-staging in the same project). tts, then api, then web.
# CI runs first on the same commit; nothing is pushed or deployed unless every
# CI job passes. On staging only (#30), the intake agent is deployed to Vertex
# AI Agent Engine after the images are pushed, and the accounts database is
# migrated before any service is deployed. One-time setup, staging and
# rollback: terraform/onboardai/README.md.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time, never cancelled halfway. Pushes that
# arrive during a deploy wait; if several wait, GitHub keeps only the newest.
# Production and staging never wait for each other. A manual run on any other
# branch deploys nothing (ci and config skip it) and gets a group of its own, so
# it never displaces a waiting deploy.
concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || format('none-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Vertex AI location the API uses for Gemini (GOOGLE_CLOUD_LOCATION). The
  # model is served on "global"; regional endpoints such as asia-southeast1 do not have it.
  VERTEX_LOCATION: global
  # The stack this run deploys: main -> production, staging -> staging (the only
  # two refs that get past ci and config). NAME_SUFFIX is appended to every
  # staging resource ID, as local.name_suffix in terraform/onboardai.
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
  NAME_SUFFIX: ${{ github.ref == 'refs/heads/staging' && '-staging' || '' }}
  # Agent Engine region of the employee form intake agent (staging only, #30).
  # Must equal var.intake_agent_location of terraform/onboardai (terraform test
  # checks it). The agent calls Gemini on VERTEX_LOCATION.
  INTAKE_AGENT_LOCATION: asia-southeast1

jobs:
  ci:
    name: CI
    # Workload Identity Federation trusts refs/heads/main (production provider)
    # and refs/heads/staging (staging provider) only; skip other refs early.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/ci.yml
    with:
      # Build all three images in CI, whatever the commit changed.
      run-all: true
    permissions:
      contents: read

  config:
    name: Check repository variables
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    # Every job that reads vars.* names the GitHub environment of its stack:
    # vars.* resolve from that environment first, then from the repository.
    # production defines no environment variables, so it reads the repository
    # variables as before; staging holds its own nine. The environment changes
    # the OIDC token's sub claim, which neither WIF provider reads.
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      AI_MODE: ${{ vars.AI_MODE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VERTEX_SEARCH_LOCATION: ${{ vars.VERTEX_SEARCH_LOCATION }}
      VERTEX_SEARCH_ENGINE_ID: ${{ vars.VERTEX_SEARCH_ENGINE_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
    steps:
      - name: Check repository variables
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ ! "$2" =~ $3 ]]; then
              echo "::error::Variable $1 is missing or malformed for $DEPLOY_ENV. Set it with the commands from 'terraform output github_variable_commands' in the $DEPLOY_ENV workspace (terraform/onboardai/README.md)."
              failed=1
            fi
          }
          check GCP_PROJECT_ID "$GCP_PROJECT_ID" '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          check GCP_REGION "$GCP_REGION" '^[a-z]+-[a-z]+[0-9]+$'
          check GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" '^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$'
          check GCP_DEPLOYER_SA "$GCP_DEPLOYER_SA" "^onboardai-deployer${NAME_SUFFIX}@${GCP_PROJECT_ID}\.iam\.gserviceaccount\.com$"
          check AI_MODE "$AI_MODE" '^(demo|gemini|gemini-chat|document-search)$'
          check GEMINI_MODEL "$GEMINI_MODEL" '^[A-Za-z0-9._-]+$'
          check VERTEX_SEARCH_LOCATION "$VERTEX_SEARCH_LOCATION" '^(global|us|eu)$'
          check VERTEX_SEARCH_ENGINE_ID "$VERTEX_SEARCH_ENGINE_ID" '^[a-z0-9][a-z0-9_-]{0,62}$'
          check FIRESTORE_DATABASE_ID "$FIRESTORE_DATABASE_ID" '^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$'
          # Each stack names its own resources: a staging run only ones ending
          # in -staging, a production run none of those.
          for name in GCP_WIF_PROVIDER VERTEX_SEARCH_ENGINE_ID FIRESTORE_DATABASE_ID; do
            value=${!name}
            if [[ -n "$NAME_SUFFIX" && "$value" != *"$NAME_SUFFIX" ]] || [[ -z "$NAME_SUFFIX" && "$value" == *-staging ]]; then
              echo "::error::Variable $name names a resource of the wrong stack for this $DEPLOY_ENV deploy."
              failed=1
            fi
          done
          if [[ "$AI_MODE" =~ ^(gemini|gemini-chat)$ ]]; then
            echo "::notice::AI_MODE=$AI_MODE: the API calls Gemini on Vertex AI ($VERTEX_LOCATION) as onboardai-api-run$NAME_SUFFIX."
          else
            echo "::notice::AI_MODE=$AI_MODE: no Gemini calls (sample content or document search)."
          fi
          exit "$failed"

  images:
    name: Build and push (${{ matrix.service }})
    needs: [ci, config]
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [web, api, tts]
    env:
      SERVICE: ${{ matrix.service }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # The stack's repository is onboardai$NAME_SUFFIX under this registry.
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build before authenticating: the auth step writes a credentials file into
      # the workspace, and the workspace is the Docker build context.
      - name: Build image
        run: docker build --platform linux/amd64 --target "$SERVICE" -t "$REGISTRY/onboardai$NAME_SUFFIX/$SERVICE:$GITHUB_SHA" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$REGISTRY/onboardai$NAME_SUFFIX/$SERVICE:$GITHUB_SHA"

  # Creates or updates the employee form intake agent on Vertex AI Agent Engine
  # with the backend's deploy command (idempotent by display name) and hands
  # its resource name to the deploy job (INTAKE_AGENT_ENGINE). Staging only for
  # now (#30): on main every step but the notice is skipped, so production
  # deploys exactly as before. Runs after every image is pushed, so nothing
  # changes unless CI passed and all three images built.
  agent:
    name: Deploy the intake agent
    needs: images
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    outputs:
      engine: ${{ steps.agent.outputs.engine }}
    steps:
      - name: Skip, the intake agent runs on staging only
        if: github.ref != 'refs/heads/staging'
        run: echo "::notice title=Intake agent skipped::Employee accounts and the intake agent run on staging only (#30); $DEPLOY_ENV deploys without them."

      # Into a subdirectory: the auth step writes its credentials file into the
      # workspace root, outside the tree the deploy command packages.
      - name: Check out
        if: github.ref == 'refs/heads/staging'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Set up Node.js 22
        if: github.ref == 'refs/heads/staging'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up uv
        if: github.ref == 'refs/heads/staging'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.8
          enable-cache: false

      # The deploy script imports server modules (google-auth-library). No
      # install scripts run, and Google credentials do not exist yet.
      - name: Install dependencies
        if: github.ref == 'refs/heads/staging'
        working-directory: repo
        run: npm ci --omit=dev --ignore-scripts

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/staging'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        if: github.ref == 'refs/heads/staging'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The agent runs as onboardai-intake$NAME_SUFFIX and reads INTAKE_MCP_TOKEN
      # from Secret Manager itself: only the secret's ID passes through here.
      # The command's last stdout line is the reasoning engine resource name.
      - name: Deploy the intake agent
        id: agent
        if: github.ref == 'refs/heads/staging'
        working-directory: repo
        run: |
          set -euo pipefail
          api_url=$(gcloud run services describe "onboardai-api$NAME_SUFFIX" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')
          if [[ ! "$api_url" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::onboardai-api$NAME_SUFFIX returned no usable URL for the agent's MCP endpoint."
            exit 1
          fi
          log="$RUNNER_TEMP/intake-agent-deploy.log"
          npm run --silent intake-agent:deploy -- \
            --project "$GCP_PROJECT_ID" \
            --location "$INTAKE_AGENT_LOCATION" \
            --display-name "OnboardAi employee form intake ($DEPLOY_ENV)" \
            --service-account "onboardai-intake$NAME_SUFFIX@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --mcp-url "$api_url/mcp" \
            --mcp-token-secret "onboardai-intake-mcp-token$NAME_SUFFIX" \
            --model "$GEMINI_MODEL" \
            --gemini-location "$VERTEX_LOCATION" | tee "$log"
          engine=$(tail -n 1 "$log")
          if [[ ! "$engine" =~ ^projects/[a-z0-9-]+/locations/${INTAKE_AGENT_LOCATION}/reasoningEngines/[0-9]+$ ]]; then
            echo "::error::The deploy command's last line is not a reasoning engine in $INTAKE_AGENT_LOCATION."
            exit 1
          fi
          echo "Intake agent: $engine"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy tts, api, web
    needs: [images, agent]
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # The stack's repository is onboardai$NAME_SUFFIX under this registry.
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}
      AI_MODE: ${{ vars.AI_MODE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VERTEX_SEARCH_LOCATION: ${{ vars.VERTEX_SEARCH_LOCATION }}
      VERTEX_SEARCH_ENGINE_ID: ${{ vars.VERTEX_SEARCH_ENGINE_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
      # Staging only (#30): the reasoning engine the agent job created or
      # updated. Empty on main.
      INTAKE_AGENT_ENGINE: ${{ needs.agent.outputs.engine }}
      # Must equal output cloud_run_deploy_flags of terraform/onboardai; its
      # terraform test fails otherwise, so a deploy never undoes an apply or the
      # other way round. Image, env vars and traffic belong to this
      # workflow; Terraform ignores them.
      WEB_RUN_FLAGS: --cpu=1 --memory=512Mi --concurrency=80 --min-instances=0 --max-instances=3 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --no-cpu-boost --startup-probe=httpGet.path=/web-health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=12
      API_RUN_FLAGS: --cpu=1 --memory=1Gi --concurrency=80 --min-instances=0 --max-instances=1 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --cpu-boost --startup-probe=httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=12
      TTS_RUN_FLAGS: --cpu=2 --memory=2Gi --concurrency=8 --min-instances=0 --max-instances=2 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --cpu-boost --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=48
    outputs:
      # The smoke job names no environment; it prints rollback commands with these.
      project_id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      web_url: ${{ steps.deploy.outputs.web_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      tts_url: ${{ steps.deploy.outputs.tts_url }}
      previous_web: ${{ steps.previous.outputs.web }}
      previous_api: ${{ steps.previous.outputs.api }}
      previous_tts: ${{ steps.previous.outputs.tts }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Record the revisions serving now (rollback targets)
        id: previous
        run: |
          set -euo pipefail
          for key in web api tts; do
            name="onboardai-$key$NAME_SUFFIX"
            if ! rev=$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.traffic[0].revisionName)'); then
              echo "::error::Cannot read $name. Apply terraform/onboardai ($DEPLOY_ENV) first; it creates the three services."
              exit 1
            fi
            echo "$name serves ${rev:-nothing yet}"
            echo "$key=$rev" >> "$GITHUB_OUTPUT"
          done

      # Staging only (#30). The Cloud Run job runs `npm run db:migrate` (safe to
      # re-run) from the api image this run deploys, as onboardai-api-run$NAME_SUFFIX,
      # through its Cloud SQL connection, with DATABASE_URL from Secret Manager:
      # no database value reaches this runner, and the job's own output goes to
      # Cloud Logging only. It finishes before any service is deployed, so the
      # new api revision never serves an unmigrated schema; if it fails, nothing
      # is deployed.
      - name: Migrate the accounts database
        if: github.ref == 'refs/heads/staging'
        run: |
          set -euo pipefail
          job="onboardai-db-migrate$NAME_SUFFIX"
          gcloud run jobs update "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --image="$REGISTRY/onboardai$NAME_SUFFIX/api:$GITHUB_SHA" --quiet
          if ! gcloud run jobs execute "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --wait --quiet; then
            echo "::error::The database migration failed, so nothing was deployed. Its log is in Cloud Logging (Cloud Run job $job)."
            exit 1
          fi

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          # deploy KEY "ENV_VARS" [extra gcloud flags...]; sets DEPLOYED_URL.
          deploy() {
            local key=$1 env_vars=$2 name="onboardai-$1$NAME_SUFFIX" flags_var url
            shift 2
            flags_var="${key^^}_RUN_FLAGS"
            local -a flags
            read -r -a flags <<< "${!flags_var}"
            echo "::group::Deploy $name"
            gcloud run deploy "$name" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --image="$REGISTRY/onboardai$NAME_SUFFIX/$key:$GITHUB_SHA" \
              --service-account="onboardai-$key-run$NAME_SUFFIX@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
              --set-env-vars="$env_vars" \
              "${flags[@]}" "$@" \
              --quiet
            # A manual rollback pins traffic to an old revision. Send it to the new one.
            gcloud run services update-traffic "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --to-latest --quiet
            url=$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')
            if [[ ! "$url" =~ ^https://[a-z0-9.-]+$ ]]; then
              echo "::error::$name returned no usable URL."
              exit 1
            fi
            echo "${key}_url=$url" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            DEPLOYED_URL=$url
          }

          deploy tts "NODE_ENV=production"
          tts_url=$DEPLOYED_URL

          # Gemini, Vertex AI Search and Firestore all use the service's own
          # identity (ADC as onboardai-api-run$NAME_SUFFIX): there is no API key.
          # --set-env-vars replaces the whole set, so variables an earlier
          # revision carried and this list lacks are dropped.
          api_env="NODE_ENV=production,AI_MODE=$AI_MODE,GEMINI_MODEL=$GEMINI_MODEL,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,GOOGLE_CLOUD_LOCATION=$VERTEX_LOCATION,VERTEX_SEARCH_LOCATION=$VERTEX_SEARCH_LOCATION,VERTEX_SEARCH_ENGINE_ID=$VERTEX_SEARCH_ENGINE_ID,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,TTS_SERVICE_URL=$tts_url"
          if [[ "$DEPLOY_ENV" == staging ]]; then
            # Employee accounts and the intake agent (#30): the Cloud SQL
            # connection (Unix socket /cloudsql/<connection name>), DATABASE_URL
            # and INTAKE_MCP_TOKEN as Secret Manager references (Cloud Run reads
            # them as onboardai-api-run-staging; the values never pass through
            # this runner), and the agent the agent job deployed.
            # Setting the secrets replaces every reference an earlier revision
            # carried.
            if [[ ! "$INTAKE_AGENT_ENGINE" =~ ^projects/[a-z0-9-]+/locations/[a-z0-9-]+/reasoningEngines/[0-9]+$ ]]; then
              echo "::error::The agent job returned no reasoning engine resource name."
              exit 1
            fi
            deploy api "$api_env,INTAKE_AGENT_ENGINE=$INTAKE_AGENT_ENGINE" \
              --set-cloudsql-instances="$GCP_PROJECT_ID:$GCP_REGION:onboardai-db$NAME_SUFFIX" \
              --set-secrets="DATABASE_URL=onboardai-database-url$NAME_SUFFIX:latest,INTAKE_MCP_TOKEN=onboardai-intake-mcp-token$NAME_SUFFIX:latest"
          else
            # Production: no secrets at all. --clear-secrets drops any reference
            # an earlier revision carried (the retired GEMINI_API_KEY mount).
            deploy api "$api_env" --clear-secrets
          fi
          api_url=$DEPLOYED_URL

          deploy web "NODE_ENV=production,API_SERVICE_URL=$api_url"

      - name: Print rollback commands
        if: failure()
        env:
          PREVIOUS_WEB: ${{ steps.previous.outputs.web }}
          PREVIOUS_API: ${{ steps.previous.outputs.api }}
          PREVIOUS_TTS: ${{ steps.previous.outputs.tts }}
        run: |
          {
            echo "### Deploy of $GITHUB_SHA to $DEPLOY_ENV failed"
            echo "A revision that failed to start receives no traffic. To put all three services back on the revisions that served before this run:"
            echo '```sh'
            for pair in "web=$PREVIOUS_WEB" "api=$PREVIOUS_API" "tts=$PREVIOUS_TTS"; do
              if [[ -n "${pair#*=}" ]]; then
                echo "gcloud run services update-traffic onboardai-${pair%%=*}$NAME_SUFFIX --project=$GCP_PROJECT_ID --region=$GCP_REGION --to-revisions=${pair#*=}=100"
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      GCP_PROJECT_ID: ${{ needs.deploy.outputs.project_id }}
      GCP_REGION: ${{ needs.deploy.outputs.region }}
      WEB_URL: ${{ needs.deploy.outputs.web_url }}
      API_URL: ${{ needs.deploy.outputs.api_url }}
      TTS_URL: ${{ needs.deploy.outputs.tts_url }}
    steps:
      - name: Check the deployed services
        run: |
          set -euo pipefail
          # probe LABEL URL ATTEMPTS RETRY_CODES: wants HTTP 200; retries 10 s apart
          # while the answer matches RETRY_CODES.
          probe() {
            local label=$1 url=$2 attempts=$3 retry=$4 code=000 i
            for ((i = 1; i <= attempts; i++)); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url") || code=000
              if [[ "$code" == 200 ]]; then
                echo "ok   $label -> 200"
                return 0
              fi
              [[ "$code" =~ ^($retry)$ ]] || break
              echo "wait $label -> $code (attempt $i of $attempts)"
              sleep 10
            done
            echo "::error::$label -> HTTP $code ($url)"
            return 1
          }
          for url in "$WEB_URL" "$API_URL" "$TTS_URL"; do
            if [[ ! "$url" =~ ^https:// ]]; then
              echo "::error::A service URL is missing from the deploy job's outputs."
              exit 1
            fi
          done
          failed=0
          # tts answers 503 until Kokoro has loaded on a cold instance.
          probe "tts GET /health" "$TTS_URL/health" 24 '503|000' || failed=1
          probe "api GET /api/health" "$API_URL/api/health" 6 '5[0-9][0-9]|000' || failed=1
          probe "web GET /web-health" "$WEB_URL/web-health" 6 '5[0-9][0-9]|000' || failed=1
          probe "web GET /api/health (proxied to api)" "$WEB_URL/api/health" 6 '5[0-9][0-9]|000' || failed=1
          probe "web GET / (frontend)" "$WEB_URL/" 6 '5[0-9][0-9]|000' || failed=1
          exit "$failed"

      # Staging only (#30): the api found its database and the agent, and the
      # MCP endpoint refuses a caller without the token.
      - name: Check employee accounts and form import
        if: github.ref == 'refs/heads/staging'
        run: |
          set -euo pipefail
          failed=0
          if ! config=$(curl -sS --fail --max-time 30 "$API_URL/api/config"); then
            echo "::error::GET /api/config failed."
            exit 1
          fi
          if jq -e '.accounts == true and .employeeImport == true' > /dev/null <<< "$config"; then
            echo "ok   api GET /api/config -> accounts and employeeImport are on"
          else
            echo "::error::GET /api/config must report accounts: true and employeeImport: true (DATABASE_URL, INTAKE_AGENT_ENGINE and INTAKE_MCP_TOKEN reached the api)."
            failed=1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' --data '{}' "$API_URL/mcp") || code=000
          if [[ "$code" == 401 ]]; then
            echo "ok   api POST /mcp without the token -> 401"
          else
            echo "::error::POST /mcp without the token answered HTTP $code, expected 401."
            failed=1
          fi
          exit "$failed"

      - name: Print rollback commands
        if: failure()
        env:
          PREVIOUS_WEB: ${{ needs.deploy.outputs.previous_web }}
          PREVIOUS_API: ${{ needs.deploy.outputs.previous_api }}
          PREVIOUS_TTS: ${{ needs.deploy.outputs.previous_tts }}
        run: |
          {
            echo "### Smoke test of $GITHUB_SHA on $DEPLOY_ENV failed"
            echo "The new revisions are serving. To put all three services back on the revisions that served before this run:"
            echo '```sh'
            for pair in "web=$PREVIOUS_WEB" "api=$PREVIOUS_API" "tts=$PREVIOUS_TTS"; do
              if [[ -n "${pair#*=}" ]]; then
                echo "gcloud run services update-traffic onboardai-${pair%%=*}$NAME_SUFFIX --project=$GCP_PROJECT_ID --region=$GCP_REGION --to-revisions=${pair#*=}=100"
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
