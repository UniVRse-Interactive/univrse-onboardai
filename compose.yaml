# Local development backing services for OnboardAi (Postgres + Firestore emulator).
# Local only: ports bind to 127.0.0.1 and the credential below is a dev placeholder.
#   docker compose up -d      start (data persists in named volumes)
#   docker compose down       stop (Firestore exports its data on clean stop)
#   docker compose down -v    stop and wipe all local data
name: onboardai-local

x-local-data: &local-data
  DATABASE_URL: postgresql://onboardai:onboardai_local@postgres:5432/onboardai
  FIRESTORE_EMULATOR_HOST: firestore:8681
  FIRESTORE_PROJECT_ID: demo-onboardai
  FIRESTORE_DATABASE_ID: '(default)'

services:
  postgres:
    image: postgres:17.6-alpine
    ports:
      - '127.0.0.1:5442:5432'
    environment:
      POSTGRES_USER: onboardai
      POSTGRES_PASSWORD: onboardai_local
      POSTGRES_DB: onboardai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onboardai -d onboardai']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Builds the emulator image once and tags it. Kept as its own service so that
  # firestore (which references the tag, with no build section) has the same config
  # hash from every checkout directory: a build context is an absolute path, and a
  # different path used to recreate the emulator on the next up.
  # It is behind a profile because Docker Desktop gives every build a new image ID,
  # and Compose recreates firestore when the tag's image ID changes. So a plain
  # `docker compose build` skips it. Build it only when the image is missing:
  #   docker image inspect onboardai-local-firebase-emulator:15.34.0 >/dev/null 2>&1 \
  #     || docker compose --profile emulator-image build firebase-emulator-image
  firebase-emulator-image:
    build:
      dockerfile_inline: |
        FROM node:22-trixie-slim
        RUN apt-get update \
          && apt-get install -y --no-install-recommends openjdk-21-jre-headless curl ca-certificates \
          && rm -rf /var/lib/apt/lists/* \
          && npm install -g firebase-tools@15.34.0 \
          && npm cache clean --force
    image: onboardai-local-firebase-emulator:15.34.0
    profiles: [emulator-image]
    command: ['true']
    restart: 'no'

  # Firebase Emulator Suite: Firestore emulator + Emulator UI (http://127.0.0.1:4000).
  # The UI runs in the browser and calls each emulator at the host:port the hub
  # reports, so every container port equals its published host port.
  # The UI only works with emulators started by firebase-tools (not gcloud's).
  firestore:
    image: onboardai-local-firebase-emulator:15.34.0
    pull_policy: never
    init: true
    working_dir: /srv
    # Export replaces its target dir, which fails on a mount point, so data lives in
    # /data/state. --import needs an existing dir; the first start has none.
    command:
      - sh
      - -c
      - |
        # A crash between the backup's two renames leaves only state.old; restore it.
        [ -d /data/state ] || { [ -d /data/state.old ] && mv /data/state.old /data/state; }
        if [ -d /data/state ]; then imp="--import=/data/state"; else imp=""; fi
        exec firebase emulators:start --project demo-onboardai \
          --only firestore,ui --config /firebase.json $$imp --export-on-exit=/data/state
    configs:
      - source: firebase_json
        target: /firebase.json
    environment:
      FIREBASE_TELEMETRY_COLLECTION: 'false'
      CI: 'true'
    ports:
      - '127.0.0.1:8681:8681'
      - '127.0.0.1:4000:4000'
      - '127.0.0.1:4400:4400'
      - '127.0.0.1:4500:4500'
      - '127.0.0.1:9150:9150'
    volumes:
      - firebase-data:/data
    stop_signal: SIGINT
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:8681/ >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # The emulator only writes its data on a clean stop, so a crash (Docker Desktop
  # quitting, a kill) would lose everything since then. Every 60 s this asks the
  # emulator hub (POST /_admin/export) to export to /data/export-next, then swaps it
  # into /data/state, the directory firestore imports on start. A failed export leaves
  # the last good /data/state untouched. One log line per export, no document data.
  firestore-backup:
    image: onboardai-local-firebase-emulator:15.34.0
    pull_policy: never
    init: true
    depends_on:
      firestore:
        condition: service_healthy
    volumes:
      - firebase-data:/data
    command:
      - sh
      - -c
      - |
        while true; do
          sleep 60
          rm -rf /data/export-next
          if curl -fsS -m 50 -X POST -H 'Content-Type: application/json' \
              -d '{"path":"/data/export-next","initiatedBy":"local-backup"}' \
              http://firestore:4400/_admin/export >/dev/null 2>&1 \
            && [ -s /data/export-next/firebase-export-metadata.json ] \
            && [ -f /data/export-next/firestore_export/firestore_export.overall_export_metadata ]; then
            rm -rf /data/state.old
            if [ -d /data/state ]; then mv /data/state /data/state.old; fi
            mv /data/export-next /data/state
            rm -rf /data/state.old
            echo "$$(date -u +%FT%TZ) firestore export ok"
          else
            rm -rf /data/export-next
            echo "$$(date -u +%FT%TZ) firestore export failed; kept the last good one"
          fi
        done
    restart: unless-stopped

  # --- Application stack (build targets of the root Dockerfile) -----------------
  #   npm run local   build, start everything and print the HR login
  # The host .env is only used for ${...} interpolation below; it is not passed in,
  # because its 127.0.0.1 URLs are wrong inside containers.

  # One-shot: creates the HR account on first run and writes its login to
  # .cache/local-stack/hr-login.json. Shares the api image.
  setup:
    build:
      context: .
      target: api
    image: onboardai-local-api
    command: ['node', 'server/local-setup.mjs']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *local-data
      LOCAL_SETUP_DIR: /local-setup
      LOCAL_HR_ID: HR-0001
      LOCAL_APP_URL: http://localhost:${LOCAL_WEB_PORT:-3100}
      LOCAL_EMULATOR_UI_URL: http://localhost:4000
    volumes:
      - ./.cache/local-stack:/local-setup

  tts:
    build:
      context: .
      target: tts
    image: onboardai-local-tts
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Gemini uses your Application Default Credentials (gcloud auth application-default
  # login). npm run local sets LOCAL_ADC_FILE to that file, or to a placeholder
  # {} file when it is missing; with the placeholder the api still starts and profile
  # autofill answers 503 AUTOFILL_UNAVAILABLE. Without LOCAL_ADC_FILE the default is
  # ~/.config/gcloud/application_default_credentials.json; if that is missing,
  # create_host_path: false makes the api fail to start (nothing is created on the host).
  api:
    build:
      context: .
      target: api
    image: onboardai-local-api
    init: true
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      firestore:
        condition: service_healthy
      tts:
        condition: service_healthy
    environment:
      <<: *local-data
      AI_MODE: ${AI_MODE:-document-search}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      VERTEX_SEARCH_ENGINE_ID: ${VERTEX_SEARCH_ENGINE_ID:-}
      VERTEX_SEARCH_LOCATION: ${VERTEX_SEARCH_LOCATION:-global}
      TTS_SERVICE_URL: http://tts:8080
      # One proxy hop in front of the api: the web container.
      TRUST_PROXY: '1'
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/application_default_credentials.json
    volumes:
      - type: bind
        source: ${LOCAL_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}
        target: /secrets/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: onboardai-local-web
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LOCAL_WEB_PORT:-3100}:8080'
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_SERVICE_URL: http://api:8080
      # The browser connects directly; there is no proxy in front of web.
      TRUST_PROXY: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/web-health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

configs:
  firebase_json:
    content: |
      {
        "emulators": {
          "singleProjectMode": true,
          "firestore": { "host": "0.0.0.0", "port": 8681, "websocketPort": 9150 },
          "ui": { "enabled": true, "host": "0.0.0.0", "port": 4000 },
          "hub": { "host": "0.0.0.0", "port": 4400 },
          "logging": { "host": "0.0.0.0", "port": 4500 }
        }
      }

volumes:
  postgres-data:
  firebase-data:
